[project]
name = "biogemt-pipelines"
version = "0.1.0"
description = "Deployment controller for BioGeMT research pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2",
]

[project.scripts]
biogemt-pipelines = "biogemt_pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
