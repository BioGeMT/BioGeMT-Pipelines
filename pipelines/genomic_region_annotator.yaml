name: genomic_region_annotator
display_name: Genomic Region Annotator
description: Annotates genomic regions and helps connect BED-like intervals to nearby genes and genomic context.
responsible: zacharopoulou
keywords:
  - genomic regions
  - BED
  - annotation
  - genes
use_cases:
  - Annotate genomic intervals from BED-like files.
  - Explore nearby genes and genomic context for candidate regions.
  - Prepare region-level annotation tables for downstream biological interpretation.
input_formats:
  - BED
  - BED-like TSV
output_formats:
  - TSV
  - CSV
result_files:
  - output/annotations.tsv
  - logs/pipeline.log
visualization_ready: false
example_args:
  - --help
repository: https://github.com/BioGeMT/genomic_region_annotator.git
runtime: uv
command: genomic-region-annotator
test_command: pytest

release_policy:
  required: true
  tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
